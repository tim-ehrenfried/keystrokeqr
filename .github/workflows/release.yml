name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-macos:
    name: macOS-App bauen & Release veröffentlichen
    runs-on: macos-15
    # Secrets sind im `if:` einer Step-Bedingung nicht direkt nutzbar
    # (GitHub Actions unterstützt den `secrets`-Kontext dort nicht) — daher
    # hier einmal auf job-level env gemappt und Steps über `if: env....`
    # gesteuert. Solange die 5 Secrets aus docs/RELEASE-PHASE.md (Phase 4)
    # fehlen, ist HAS_SIGNING_SECRETS "false" und der ad-hoc-Pfad
    # (unverändertes Alt-Verhalten) läuft wie bisher.
    env:
      HAS_SIGNING_SECRETS: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gestyltes DMG bauen (ad-hoc-signiert)
        working-directory: macos
        # OFFICIAL=1: only our release pipeline bakes in the official branding
        # (contact email, landing-page links, App-Store QR). Community builds
        # from the repo stay neutral by default. See docs/BRANDING.md.
        run: make dmg OFFICIAL=1

      - name: Bundle & DMG verifizieren (ad-hoc)
        working-directory: macos
        run: |
          test -x "dist/KeystrokeQR Host.app/Contents/MacOS/QRKeyboardHost"
          test -f "dist/KeystrokeQR Host.app/Contents/Resources/AppIcon.icns"
          test -f "dist/KeystrokeQR Host.app/Contents/Resources/en.lproj/Localizable.strings"
          test -f "dist/KeystrokeQR Host.app/Contents/Resources/de.lproj/Localizable.strings"
          codesign --verify --verbose=2 "dist/KeystrokeQR Host.app"
          test -f "dist/KeystrokeQR-Host.dmg"

      - name: "Developer-ID: signieren + notarisieren"
        if: env.HAS_SIGNING_SECRETS == 'true'
        working-directory: macos
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail

          KEYCHAIN="signing-temp.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/developer-id-cert.p12"
          ASC_KEY_PATH="$RUNNER_TEMP/asc-api-key.p8"

          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "CERT_PATH=$CERT_PATH" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

          # --- Temp-Keychain anlegen + Zertifikat importieren -----------------
          echo "$MACOS_CERT_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security

          # Keychain in die Suchliste aufnehmen (bestehende Keychains erhalten)
          EXISTING_KEYCHAINS="$(security list-keychains -d user | sed 's/[\"    ]//g')"
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING_KEYCHAINS

          # codesign ohne erneute Passwortabfrage zugreifen lassen
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # --- Signing-Identität ermitteln -------------------------------------
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -o '"Developer ID Application:[^"]*"' | head -1 | tr -d '"')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::Keine 'Developer ID Application'-Identität im importierten Zertifikat (MACOS_CERT_P12) gefunden." >&2
            exit 1
          fi
          echo "Signing-Identität: $IDENTITY"

          # --- App neu signieren (Hardened Runtime + Secure Timestamp) + DMG neu bauen ---
          make app OFFICIAL=1 SIGN_IDENTITY="$IDENTITY"
          make dmg OFFICIAL=1 SIGN_IDENTITY="$IDENTITY"

          codesign --verify --deep --strict --verbose=2 "dist/KeystrokeQR Host.app"

          # --- Notarisieren + Ticket aufkleben ---------------------------------
          echo "$ASC_KEY_P8" | base64 --decode > "$ASC_KEY_PATH"

          make notarize \
            ASC_KEY_PATH="$ASC_KEY_PATH" \
            ASC_KEY_ID="$ASC_KEY_ID" \
            ASC_ISSUER_ID="$ASC_ISSUER_ID"

          # --- Verifikation: Gatekeeper akzeptiert das gestapelte DMG ----------
          spctl --assess --type open --context context:primary-signature \
            --verbose=4 "dist/KeystrokeQR-Host.dmg"
          xcrun stapler validate "dist/KeystrokeQR-Host.dmg"

          echo "Signiert + notarisiert + gestapelt: dist/KeystrokeQR-Host.dmg"

      - name: "Signing-Keychain + Key-Dateien aufräumen"
        if: always() && env.HAS_SIGNING_SECRETS == 'true'
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$CERT_PATH" "$ASC_KEY_PATH" 2>/dev/null || true

      - name: "Hinweis: unsigniertes Release (Secrets fehlen)"
        if: env.HAS_SIGNING_SECRETS != 'true'
        run: |
          echo "::warning::MACOS_CERT_P12/MACOS_CERT_PASSWORD/ASC_KEY_ID/ASC_ISSUER_ID/ASC_KEY_P8 sind nicht (vollständig) als GitHub-Secrets gesetzt — es wird ein NICHT signiertes/notarisiertes (nur ad-hoc-signiertes) DMG released. macOS zeigt Endnutzern beim Öffnen eine Gatekeeper-Warnung. Setup: docs/RELEASE-PHASE.md, Phase 4."

      - name: Release-Asset auf den gewünschten Namen bringen
        working-directory: macos
        run: cp "dist/KeystrokeQR-Host.dmg" "KeystrokeQR-Host-macOS.dmg"

      - name: GitHub-Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          files: macos/KeystrokeQR-Host-macOS.dmg
          generate_release_notes: true
