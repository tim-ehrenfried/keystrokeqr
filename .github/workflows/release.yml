name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-macos:
    name: macOS-App bauen & Release veröffentlichen
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gestyltes DMG bauen (ad-hoc-signiert)
        working-directory: macos
        # OFFICIAL=1: only our release pipeline bakes in the official branding
        # (contact email, landing-page links, App-Store QR). Community builds
        # from the repo stay neutral by default. See docs/BRANDING.md.
        run: make dmg OFFICIAL=1

      - name: Bundle & DMG verifizieren
        working-directory: macos
        run: |
          test -x "dist/KeystrokeQR Host.app/Contents/MacOS/QRKeyboardHost"
          test -f "dist/KeystrokeQR Host.app/Contents/Resources/AppIcon.icns"
          test -f "dist/KeystrokeQR Host.app/Contents/Resources/en.lproj/Localizable.strings"
          test -f "dist/KeystrokeQR Host.app/Contents/Resources/de.lproj/Localizable.strings"
          codesign --verify --verbose=2 "dist/KeystrokeQR Host.app"
          test -f "dist/KeystrokeQR-Host.dmg"
          # Release-Asset auf den gewünschten Namen bringen.
          cp "dist/KeystrokeQR-Host.dmg" "KeystrokeQR-Host-macOS.dmg"

      - name: GitHub-Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          files: macos/KeystrokeQR-Host-macOS.dmg
          generate_release_notes: true
