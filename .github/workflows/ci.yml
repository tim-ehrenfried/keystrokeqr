name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos-host:
    name: macOS-Host (swift build + make app)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift-Version anzeigen
        run: swift --version

      - name: SwiftPM-Build
        working-directory: macos
        run: swift build -c release

      - name: Unit-Tests (swift test)
        working-directory: macos
        run: swift test

      - name: App-Bundle bauen (make app)
        working-directory: macos
        run: make app

      - name: Bundle verifizieren
        working-directory: macos
        run: |
          test -x "dist/KeystrokeQR Host.app/Contents/MacOS/QRKeyboardHost"
          test -f "dist/KeystrokeQR Host.app/Contents/Resources/AppIcon.icns"
          plutil -lint "dist/KeystrokeQR Host.app/Contents/Info.plist"
          codesign --verify --verbose=2 "dist/KeystrokeQR Host.app"

  ios-scanner:
    name: iOS-Scanner (Simulator-Build)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      - name: Simulator-Build (ohne Codesigning)
        run: >
          xcodebuild
          -project ios/QRKeyboardScanner.xcodeproj
          -scheme QRKeyboardScanner
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          build
          CODE_SIGNING_ALLOWED=NO

      - name: Test-Ziel-Simulator ermitteln
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+( Pro( Max)?| Plus)?' | head -1)
          if [ -z "$NAME" ]; then echo "Kein iPhone-Simulator verfügbar" >&2; exit 1; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Nutze Simulator: $NAME"

      - name: Unit-Tests (Simulator)
        run: >
          xcodebuild test
          -project ios/QRKeyboardScanner.xcodeproj
          -scheme QRKeyboardScanner
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}"
          CODE_SIGNING_ALLOWED=NO
